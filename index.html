<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>实时互发消息</title>
<style>
  body {
    max-width: 600px;
    margin: 20px auto;
    font-family: Arial;
    background: #f5f5f5;
  }
  #messages {
    height: 400px;
    border: 1px solid #ddd;
    background: white;
    padding: 10px;
    overflow-y: auto;
    border-radius: 8px;
    margin-bottom: 10px;
  }
  #input {
    width: 70%;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ddd;
    border-radius: 8px;
  }
  button {
    width: 25%;
    padding: 10px;
    font-size: 16px;
    background: #009688;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="messages"></div>
<input id="input" placeholder="输入消息...">
<button onclick="send()">发送</button>

<script>
  // 免费公共广播服务，无需KEY，无需注册
  // 同一个房间，所有人实时互通
  const room = "my-private-room-123";
  const ws = new WebSocket(`wss://ws.zeromq.io/broadcast/${room}`);

  const messages = document.getElementById("messages");
  const input = document.getElementById("input");

  // 收到消息立刻显示
  ws.onmessage = (e) => {
    const div = document.createElement("div");
    div.style.margin = "5px 0";
    div.style.padding = "6px 10px";
    div.style.background = "#e0f7fa";
    div.style.borderRadius = "5px";
    div.textContent = e.data;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  };

  // 发送消息
  function send() {
    const text = input.value.trim();
    if (!text) return;
    ws.send(text);
    input.value = "";
  }

  // 回车发送
  input.addEventListener("keypress", (e) => {
    if (e.key === "Enter") send();
  });
</script>

</body>
</html>
