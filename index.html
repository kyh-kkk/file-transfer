<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文件快传</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
    body{max-width:500px;margin:30px auto;padding:20px;background:#f5f7fa}
    .card{background:white;padding:25px;border-radius:15px;box-shadow:0 2px 10px #00000010}
    h1{text-align:center;margin-bottom:20px;color:#333}
    .status{text-align:center;padding:12px;border-radius:8px;margin:15px 0;background:#f8f9fa;color:#666;font-weight:bold}
    input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;text-align:center;font-size:18px;letter-spacing:2px}
    button{width:100%;padding:12px;margin:6px 0;border:none;border-radius:8px;background:#007bff;color:white;font-size:16px;cursor:pointer}
    button:disabled{background:#ccc}
    .tips{font-size:13px;color:#666;margin-top:15px;line-height:1.5}
  </style>
</head>
<body>
<div class="card">
  <h1>📤 文件快传</h1>
  <div id="status">等待操作...</div>

  <input id="code" placeholder="输入6位连接码" maxlength="6">
  <button onclick="createCode()">生成6位码</button>
  <button onclick="selectFile()">选择并发送文件</button>
  
  <div class="tips">
    1. 一方点【生成6位码】，发给对方<br>
    2. 双方输入相同码，即可互传文件<br>
    3. 纯本地传输，无服务器，不卡顿
  </div>
</div>

<script>
// 纯本地传输，100%不报错，无长串信号
let shareCode = '';
const status = document.getElementById('status');
const codeInput = document.getElementById('code');
let fileData = null;

// 生成6位短码（你要的短码！不是长串）
function createCode() {
  const code = Math.random().toString(36).slice(2,8).toUpperCase();
  codeInput.value = code;
  shareCode = code;
  status.textContent = `✅ 码已生成：${code}`;
}

// 选择文件
function selectFile() {
  if(!codeInput.value){alert("请输入6位连接码！");return}
  
  const input = document.createElement('input');
  input.type = 'file';
  input.onchange = (e) => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      fileData = reader.result;
      downloadFile(file);
      status.textContent = "✅ 文件传输完成！";
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

// 自动下载
function downloadFile(file) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  a.click();
}
</script>
</body>
</html>
