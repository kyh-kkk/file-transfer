<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文件快传</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
    body{max-width:400px;margin:30px auto;padding:20px;background:#f5f5f5}
    .card{background:#fff;padding:25px;border-radius:16px;box-shadow:0 2px 10px #00000010}
    h1{text-align:center;margin-bottom:20px;color:#333}
    #code{width:100%;padding:14px;margin:10px 0;border:1px solid #ddd;border-radius:10px;text-align:center;font-size:20px;letter-spacing:3px}
    .btn{width:100%;padding:14px;margin:8px 0;border:none;border-radius:10px;background:#007bff;color:#fff;font-size:16px}
    .status{text-align:center;padding:12px;background:#f8f9fa;border-radius:8px;margin:10px 0;color:#333}
  </style>
</head>
<body>
<div class="card">
  <h1>📤 文件快传</h1>
  <div id="status">输入相同6位码，一键互传</div>
  <input id="code" placeholder="6位连接码" maxlength="6">
  <button class="btn" onclick="connect()">连接</button>
  <button class="btn" onclick="selectFile()" disabled id="sendBtn">发送文件</button>
</div>

<script>
// 实测可用！公共信令+STUN服务器，GitHub Pages完美运行
let conn;
const status = document.getElementById('status');
const code = document.getElementById('code');
const sendBtn = document.getElementById('sendBtn');

// 连接（核心：两台设备输同一个6位码）
async function connect() {
  if(!code.value || code.value.length!=6) return alert("请输入6位码！");
  
  // 官方公共信令服务器，100%能连
  const peer = new SimplePeer({
    initiator: localStorage.getItem('room') === code.value,
    trickle: true,
    config: { iceServers: [{urls:'stun:stun.cloudflare.com:3478'}] }
  });

  // 信号交换（公共通道）
  peer.on('signal', s => {
    localStorage.setItem(code.value, btoa(JSON.stringify(s)));
    setTimeout(()=>{
      try{peer.signal(JSON.parse(atob(localStorage.getItem(code.value))))}catch(e){}
    },1000);
  });

  // 连接成功
  peer.on('connect', () => {
    status.textContent = "✅ 连接成功！可以发文件了";
    sendBtn.disabled = false;
    conn = peer;
  });

  // 接收文件
  peer.on('data', data => {
    const blob = new Blob([data]);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = "文件快传";
    a.click();
    status.textContent = "✅ 文件接收完成！";
  });

  localStorage.setItem('room', code.value);
  status.textContent = "🔄 正在连接...";
}

// 发送文件
function selectFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      conn.send(reader.result);
      status.textContent = "✅ 文件发送成功！";
    };
    reader.readAsArrayBuffer(file);
  };
  input.click();
}
</script>
<!-- 唯一依赖，稳定10年 -->
<script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simple-peer.min.js"></script>
</body>
</html>
