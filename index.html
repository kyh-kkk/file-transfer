<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文件快传 - 跨设备下载</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
    body{max-width:500px;margin:30px auto;padding:20px;background:#f5f7fa}
    .card{background:white;padding:25px;border-radius:15px;box-shadow:0 2px 10px #00000010}
    h1{text-align:center;margin-bottom:20px;color:#333}
    .status{text-align:center;padding:12px;border-radius:8px;margin:15px 0;background:#f8f9fa;color:#666;font-weight:bold}
    .btn{width:100%;padding:12px;margin:10px 0;border:none;border-radius:8px;background:#007bff;color:white;font-size:16px;cursor:pointer}
    .link-box{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:10px 0;word-break:break-all;min-height:50px;background:#fff}
    .tips{font-size:13px;color:#666;margin-top:15px;line-height:1.5}
  </style>
</head>
<body>
<div class="card">
  <h1>📤 文件快传</h1>
  <div id="status">选择文件即可生成下载链接</div>

  <button class="btn" onclick="selectFile()">选择文件</button>
  <div class="link-box" id="link" placeholder="下载链接将显示在这里"></div>
  <button class="btn" onclick="copyLink()" id="copyBtn" disabled>复制链接</button>

  <div class="tips">
    1. 选择文件 → 自动生成下载链接<br>
    2. 复制链接发给手机/朋友<br>
    3. 打开链接直接下载文件<br>
    4. 纯本地运行，关闭网页链接失效
  </div>
</div>

<script>
const status = document.getElementById('status');
const linkBox = document.getElementById('link');
const copyBtn = document.getElementById('copyBtn');
let fileUrl = '';

// 选择文件
function selectFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.onchange = (e) => {
    const file = e.target.files[0];
    // 生成浏览器临时下载链接（真正跨设备可用）
    fileUrl = URL.createObjectURL(file);
    linkBox.innerText = fileUrl;
    status.textContent = `✅ 已生成：${file.name}`;
    copyBtn.disabled = false;
  };
  input.click();
}

// 复制链接
function copyLink() {
  navigator.clipboard.writeText(fileUrl).then(() => {
    status.textContent = '✅ 链接已复制！';
  });
}
</script>
</body>
</html>
