<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文件快传</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
    body{max-width:400px;margin:30px auto;padding:20px;background:#f5f7fa}
    .box{background:#fff;padding:25px;border-radius:15px;box-shadow:0 2px 10px #00000010}
    h1{text-align:center;margin-bottom:20px}
    .input{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px;text-align:center;font-size:18px}
    .btn{width:100%;padding:12px;margin:8px 0;border:none;border-radius:8px;background:#007bff;color:white;font-size:16px}
    .status{text-align:center;padding:12px;background:#f8f9fa;border-radius:8px;margin:10px 0}
  </style>
</head>
<body>
<div class="box">
  <h1>📤 文件快传</h1>
  <div class="status" id="status">输入6位相同码即可互传</div>
  <input class="input" id="code" placeholder="输入6位连接码" maxlength="6">
  <button class="btn" onclick="sendFile()">发送文件</button>
  <button class="btn" onclick="receiveFile()">接收文件</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js"></script>
<script>
const status = document.getElementById('status');
const code = document.getElementById('code');
let peer, conn;

// 发送文件
function sendFile() {
  if(!code.value) return alert('输入6位码');
  peer = new Peer(code.value);
  peer.on('open', () => {
    status.textContent = '✅ 等待对方连接...';
    peer.on('connection', (c) => {
      conn = c;
      conn.on('data', (data) => {
        const blob = new Blob([data]);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '传输文件';
        a.click();
        status.textContent = '✅ 接收完成';
      });
      status.textContent = '✅ 已连接，选择文件发送';
      const input = document.createElement('input');
      input.type = 'file';
      input.onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          conn.send(ev.target.result);
          status.textContent = '✅ 发送成功';
        };
        reader.readAsArrayBuffer(e.target.files[0]);
      };
      input.click();
    });
  });
}

// 接收文件
function receiveFile() {
  if(!code.value) return alert('输入6位码');
  conn = new Peer().connect(code.value);
  conn.on('open', () => {
    status.textContent = '✅ 已连接，等待文件...';
    conn.on('data', (data) => {
      const blob = new Blob([data]);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '传输文件';
      a.click();
      status.textContent = '✅ 接收完成';
    });
  });
}
</script>
</body>
</html>
