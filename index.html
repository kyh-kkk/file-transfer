<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文件快传</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family: system-ui, sans-serif;}
    body{max-width:500px;margin:30px auto;padding:20px;background:#f5f7fa;}
    .card{background:white;padding:25px;border-radius:15px;box-shadow:0 2px 10px #00000010;}
    h1{text-align:center;margin-bottom:20px;color:#333;}
    .status{text-align:center;padding:12px;border-radius:8px;margin:15px 0;background:#f8f9fa;color:#666;font-weight:bold;}
    textarea{width:100%;height:90px;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:8px;resize:none;}
    button{width:100%;padding:12px;margin:6px 0;border:none;border-radius:8px;background:#007bff;color:white;font-size:16px;cursor:pointer;}
    button:disabled{background:#ccc;cursor:not-allowed;}
    .tips{font-size:13px;color:#666;margin-top:15px;line-height:1.5;}
  </style>
</head>
<body>
<div class="card">
  <h1>📤 文件快传</h1>
  <div id="status">等待操作...</div>

  <textarea id="mySignal" placeholder="我的信号（复制发给对方）"></textarea>
  <textarea id="friendSignal" placeholder="粘贴对方的信号"></textarea>

  <button onclick="startSend()">1. 我是发送方</button>
  <button onclick="startReceive()">2. 我是接收方</button>
  <button id="sendBtn" disabled onclick="sendFile()">3. 发送文件</button>

  <div class="tips">
    🔥 必看：手机开热点，电脑连手机热点！<br>
    1. 发送方点按钮 → 复制信号<br>
    2. 接收方粘贴信号 → 点按钮<br>
    3. 双方互粘信号 → 显示已响应即可传文件
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simple-peer.min.js"></script>
<script>
let peer = null;
const status = document.getElementById('status');
const mySig = document.getElementById('mySignal');
const friendSig = document.getElementById('friendSignal');
const sendBtn = document.getElementById('sendBtn');

//  GitHub Pages HTTPS 专用稳定配置
const cfg = {
  trickle: false,
  config: { iceServers: [{ urls: 'stun:stun.cloudflare.com:3478' }] }
};

// 重置状态
function reset() {
  peer = null;
  mySig.value = '';
  sendBtn.disabled = true;
}

// 发送方
function startSend() {
  reset();
  status.textContent = "🔄 生成信号中...";
  
  try {
    peer = new SimplePeer({ ...cfg, initiator: true });
    initEvents();
  } catch (e) {
    status.textContent = "❌ 生成失败，刷新重试";
  }
}

// 接收方
function startReceive() {
  if (!friendSig.value) {
    alert("请先粘贴对方的信号！");
    return;
  }
  reset();
  status.textContent = "🔄 连接中...";
  
  try {
    peer = new SimplePeer({ ...cfg, initiator: false });
    initEvents();
    peer.signal(JSON.parse(friendSig.value));
  } catch (e) {
    status.textContent = "❌ 信号错误";
  }
}

// 核心事件（修复所有卡死BUG）
function initEvents() {
  // 生成信号成功
  peer.on('signal', (s) => {
    mySig.value = JSON.stringify(s);
    status.textContent = "✅ 信号已生成，请互粘信号";
  });

  // 粘贴对方信号 → 已响应
  friendSig.oninput = () => {
    if (!peer) return;
    try {
      peer.signal(JSON.parse(friendSig.value));
      status.textContent = "✅ 已响应！等待连接...";
    } catch (e) {}
  };

  // 连接成功
  peer.on('connect', () => {
    status.textContent = "🎉 连接成功！可以发文件了";
    sendBtn.disabled = false;
  });

  // 接收文件
  peer.on('data', (data) => {
    const blob = new Blob([data]);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.download = "文件快传";
    a.href = url;
    a.click();
    status.textContent = "✅ 文件接收完成";
  });

  // 错误捕获（不卡死）
  peer.on('error', (err) => {
    status.textContent = "❌ 连接错误，刷新重试";
  });
}

// 发送文件
function sendFile() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.onchange = (e) => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      peer.send(reader.result);
      status.textContent = "✅ 文件发送成功";
    };
    reader.readAsArrayBuffer(file);
  };
  inp.click();
}
</script>
</body>
</html>
